name: .NET Desktop Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    env:
      Solution_Name: GithubLauncher.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore GithubLauncher.sln

    - name: Publish Windows x64
      run: dotnet publish GithubLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/win-x64

    - name: Upload Windows x64
      uses: actions/upload-artifact@v4
      with:
        name: GithubLauncher-Windows-x64
        path: publish/win-x64
        retention-days: 14

  build-linux:
    runs-on: ubuntu-latest
    
    env:
      Solution_Name: GithubLauncher.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore GithubLauncher.sln

    - name: Publish Linux x64
      run: dotnet publish GithubLauncher.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/linux-x64

    - name: Publish Linux ARM64
      run: dotnet publish GithubLauncher.csproj -c Release -r linux-arm64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/linux-arm64

    - name: Upload Linux x64
      uses: actions/upload-artifact@v4
      with:
        name: GithubLauncher-Linux-x64
        path: publish/linux-x64
        retention-days: 14

    - name: Upload Linux ARM64
      uses: actions/upload-artifact@v4
      with:
        name: GithubLauncher-Linux-ARM64
        path: publish/linux-arm64
        retention-days: 14

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: osx-arm64
            architecture: ARM64
          - runtime: osx-x64
            architecture: x64
    runs-on: macos-15

    env:
      Solution_Name: GithubLauncher.sln
      App_Name: GithubLauncher

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore GithubLauncher.sln

    - name: Package macOS ${{ matrix.architecture }}
      run: bash scripts/package-macos.sh ${{ matrix.runtime }}

    - name: Smoke test native launcher
      if: matrix.runtime == 'osx-arm64'
      run: publish/${{ matrix.runtime }}/GithubLauncher.app/Contents/MacOS/GithubLauncher --help

    - name: Upload macOS ${{ matrix.architecture }}
      uses: actions/upload-artifact@v4
      with:
        name: GithubLauncher-macOS-${{ matrix.architecture }}
        path: publish/GithubLauncher-macOS-${{ matrix.architecture }}.zip
        if-no-files-found: error
        retention-days: 14